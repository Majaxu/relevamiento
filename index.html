<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relevamiento de tareas</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<meta name="robots" content="noindex">

<!--
  Página de acceso al Relevamiento de tareas (GitHub Pages).
  Redirige automáticamente al formulario (Google Apps Script).

  1) Reemplazá el valor de APP_URL de abajo por la URL de la app (la que termina en /exec).
  2) Si algún día cambia la URL de la app, se cambia solo acá.
-->

<style>
  :root{ --navy:#123a72; --navy2:#0e2b57; --green:#1f9d61; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
  }
  .box{max-width:440px}
  .logo{width:min(320px,78vw); height:auto; margin:0 auto 26px; display:block}
  .spinner{
    width:40px; height:40px; margin:0 auto 20px; border-radius:50%;
    border:4px solid rgba(255,255,255,.22); border-top-color:var(--green);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .spinner{animation:none} }
  .title{font-size:15px; font-weight:800; letter-spacing:.3px; opacity:.95; margin-bottom:20px}
  .hint{font-size:14px; opacity:.88; line-height:1.5}
  a.manual{display:inline-block; margin-top:4px; color:#fff; font-weight:750; text-decoration:underline; text-underline-offset:3px}
  [hidden]{display:none !important}
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="logo-jb-blanco.png" alt="Juárez Beltrán · Asesores Inmobiliarios">
    <div class="title">Relevamiento de tareas · Administración</div>

    <div id="redir">
      <div class="spinner" role="status" aria-label="Cargando"></div>
      <p class="hint">
        Abriendo el formulario…<br>
        Tenés que entrar con tu cuenta de Juárez Beltrán.<br>
        Si no se abre en unos segundos,
        <a class="manual" id="manual" href="#">entrá desde acá</a>.
      </p>
    </div>

    <p class="hint" id="falta" hidden>
      Falta configurar esta página: hay que pegar la URL de la app en el archivo <b>index.html</b>
      (ver el Paso 5 de apps-script/DEPLOY.md).
    </p>
  </div>

  <script>
    var APP_URL = "PEGAR_AQUI_LA_URL_DE_LA_APP";

    (function () {
      var lista = /^https:\/\/script\.google\.com\//.test(APP_URL);
      document.getElementById("redir").hidden = !lista;
      document.getElementById("falta").hidden = lista;
      if (!lista) return;
      document.getElementById("manual").href = APP_URL;
      // replace() evita que "Atrás" vuelva a esta pantalla en un loop.
      window.location.replace(APP_URL);
    })();
  </script>
</body>
</html>
